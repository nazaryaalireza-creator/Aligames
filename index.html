<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0d18">
    <link rel="icon" type="image/webp" href="./OIP.webp">
    <title>Classroom</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0c0d18;
        color: #f5f3ff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -15%, rgb(125 82 255 / 25%), transparent 42rem),
          radial-gradient(ellipse at 100% 75%, rgb(36 154 190 / 12%), transparent 35rem),
          #0c0d18;
      }

      main {
        width: min(100% - 40px, 1080px);
        margin: 0 auto;
        padding: 72px 0 56px;
      }

      header {
        margin-bottom: 44px;
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 20px;
        padding: 8px 13px;
        border: 1px solid rgb(186 165 255 / 20%);
        border-radius: 999px;
        background: rgb(255 255 255 / 5%);
        color: #c8b8ff;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9c7aff;
        box-shadow: 0 0 12px #9c7aff;
        content: "";
      }

      h1 {
        margin: 0;
        background: linear-gradient(105deg, #fff 20%, #c9b8ff 62%, #8bdcf2);
        background-clip: text;
        color: transparent;
        font-size: clamp(3.2rem, 9vw, 6rem);
        font-weight: 850;
        letter-spacing: -0.075em;
        line-height: 1;
        -webkit-background-clip: text;
      }

      header p {
        margin: 18px 0 0;
        color: #aaa8bd;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .section-heading h2 {
        margin: 0;
        color: #e8e5f5;
        font-size: 1rem;
        font-weight: 700;
      }

      .section-heading span {
        color: #858398;
        font-size: 0.85rem;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .game-box {
        --accent: #a98aff;
        position: relative;
        display: flex;
        min-height: 154px;
        align-items: center;
        gap: 16px;
        overflow: hidden;
        padding: 22px;
        border: 1px solid rgb(213 204 255 / 12%);
        border-radius: 20px;
        background: linear-gradient(135deg, rgb(255 255 255 / 7%), rgb(255 255 255 / 3%));
        color: #f5f3ff;
        text-decoration: none;
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .game-box::before {
        position: absolute;
        top: -48px;
        right: -38px;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
        filter: blur(65px);
        opacity: 0.15;
        transition: opacity 180ms ease;
      }

      .game-box:hover {
        transform: translateY(-5px);
        border-color: color-mix(in srgb, var(--accent) 60%, transparent);
        background: linear-gradient(135deg, rgb(255 255 255 / 10%), rgb(255 255 255 / 4%));
        box-shadow: 0 14px 35px rgb(0 0 0 / 20%);
      }

      .game-box:hover::before {
        opacity: 0.28;
      }

      .game-icon {
        position: relative;
        display: grid;
        width: 54px;
        height: 54px;
        flex: 0 0 54px;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-radius: 16px;
        background: color-mix(in srgb, var(--accent) 12%, #171725);
        font-size: 1.55rem;
      }

      .game-info {
        position: relative;
        min-width: 0;
      }

      .game-name {
        display: block;
        font-size: 1.04rem;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .game-arrow {
        position: relative;
        margin-left: auto;
        color: #878498;
        font-size: 1.15rem;
        transition: transform 180ms ease, color 180ms ease;
      }

      .game-box:hover .game-arrow {
        transform: translate(3px, -3px);
        color: var(--accent);
      }

      footer {
        margin-top: 30px;
        color: #777587;
        font-size: 0.8rem;
        text-align: center;
      }

      .tool-section {
        margin-top: 34px;
      }

      .proxy-card {
        --accent: #56e0b2;
        position: relative;
        display: flex;
        min-height: 110px;
        align-items: center;
        gap: 18px;
        overflow: hidden;
        padding: 22px 26px;
        border: 1px solid rgb(86 224 178 / 35%);
        border-radius: 20px;
        background:
          radial-gradient(ellipse at 100% 50%, rgb(86 224 178 / 17%), transparent 50%),
          linear-gradient(110deg, rgb(24 128 56 / 22%), rgb(255 255 255 / 4%));
        color: #f5fff9;
        text-decoration: none;
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .proxy-card:hover {
        transform: translateY(-4px);
        border-color: #56e0b2;
        box-shadow: 0 14px 35px rgb(0 0 0 / 20%), 0 0 28px rgb(86 224 178 / 12%);
      }

      .proxy-icon {
        display: grid;
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        place-items: center;
        border: 1px solid rgb(86 224 178 / 35%);
        border-radius: 17px;
        background: rgb(86 224 178 / 12%);
        color: #73edc4;
        font-size: 1.7rem;
      }

      .proxy-name {
        font-size: 1.05rem;
        font-weight: 750;
      }

      .proxy-address {
        margin-left: auto;
        color: #85d9bd;
        font-size: 0.9rem;
      }

      @media (max-width: 760px) {
        .game-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 500px) {
        main {
          width: min(100% - 28px, 420px);
          padding-top: 54px;
        }

        header {
          margin-bottom: 34px;
        }

        .game-grid {
          gap: 11px;
        }

        .game-box {
          min-height: 132px;
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
          padding: 16px;
          border-radius: 16px;
        }

        .game-icon {
          width: 44px;
          height: 44px;
          flex-basis: 44px;
          border-radius: 13px;
          font-size: 1.3rem;
        }

        .game-arrow {
          position: absolute;
          right: 14px;
          bottom: 14px;
        }

        .game-name {
          font-size: 0.95rem;
        }

        .proxy-card {
          gap: 13px;
          padding: 18px;
        }

        .proxy-icon {
          width: 48px;
          height: 48px;
          flex-basis: 48px;
          border-radius: 14px;
        }

        .proxy-address {
          font-size: 0.78rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Din spelhub</p>
        <h1>Ali Games</h1>
        <p>Välj ett spel och kör igång.</p>
      </header>

      <div class="section-heading">
        <h2>Spel att spela</h2>
        <span>9 spel</span>
      </div>

      <section class="game-grid" aria-label="Spel">
        <a class="game-box" href="https://worldguessr.com" target="_blank" rel="noopener noreferrer" style="--accent: #68d5b0">
          <span class="game-icon" aria-hidden="true">🌍</span>
          <span class="game-info"><span class="game-name">Worldguessr</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://geo-fs.com" target="_blank" rel="noopener noreferrer" style="--accent: #6cc8ff">
          <span class="game-icon" aria-hidden="true">✈️</span>
          <span class="game-info"><span class="game-name">Fly Game</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://humanbenchmark.com" target="_blank" rel="noopener noreferrer" style="--accent: #ffc56b">
          <span class="game-icon" aria-hidden="true">🧠</span>
          <span class="game-info"><span class="game-name">Benchmark</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://3daimtrainer.com" target="_blank" rel="noopener noreferrer" style="--accent: #ff7979">
          <span class="game-icon" aria-hidden="true">🎯</span>
          <span class="game-info"><span class="game-name">3D Aim Trainer</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://dialed.gg" target="_blank" rel="noopener noreferrer" style="--accent: #fb8ccc">
          <span class="game-icon" aria-hidden="true">🎨</span>
          <span class="game-info"><span class="game-name">Color Game</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://slowroads.io" target="_blank" rel="noopener noreferrer" style="--accent: #8edb9b">
          <span class="game-icon" aria-hidden="true">🚗</span>
          <span class="game-info"><span class="game-name">Car Game</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://lolbeans.io" target="_blank" rel="noopener noreferrer" style="--accent: #f1ca65">
          <span class="game-icon" aria-hidden="true">🫘</span>
          <span class="game-info"><span class="game-name">BEANS!</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://pakohighway.online" target="_blank" rel="noopener noreferrer" style="--accent: #ff9b64">
          <span class="game-icon" aria-hidden="true">🛣️</span>
          <span class="game-info"><span class="game-name">Pako Highway</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="game-box" href="https://toughlovearena.com" target="_blank" rel="noopener noreferrer" style="--accent: #bb91ff">
          <span class="game-icon" aria-hidden="true">🥊</span>
          <span class="game-info"><span class="game-name">1v1 Game</span></span>
          <span class="game-arrow" aria-hidden="true">↗</span>
        </a>
      </section>

      <section class="tool-section" aria-label="Verktyg">
        <div class="section-heading">
          <h2>Verktyg</h2>
          <span>Extra</span>
        </div>
        <a class="proxy-card" href="https://onlineproxy.org" target="_blank" rel="noopener noreferrer">
          <span class="proxy-icon" aria-hidden="true">↗</span>
          <span class="proxy-name">Proxy</span>
          <span class="proxy-address">onlineproxy.org</span>
        </a>
      </section>

      <footer>Ali Games · Välj ditt nästa äventyr</footer>
    </main>
  </body>
</html>
